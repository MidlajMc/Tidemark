name: Flow
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Flow:
    type: application
    platform: iOS
    sources:
      - path: Flow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.flow
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Flow
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
  FlowTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FlowTests
    dependencies:
      - target: Flow
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.flow.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Flow:
    build:
      targets:
        Flow: all
        FlowTests: [test]
    test:
      targets:
        - FlowTests
